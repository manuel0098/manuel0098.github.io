<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Luis Carrillo Sotomayor">
    <meta name="description" content="Prácticas de Desarrollo Web.">
    <meta name="keywords" content="desarrollo web, HTML, prácticas">
    <title>Contacto con el restaurante</title>
</head>
<body>
<header><h1>Envíenos su mensaje</h1></header>
<main>
    <form action="#" method="get">
        <p><label for="nombre">Su nombre:</label> <input type="text" id="nombre" name="nombre" required></p>
        <p><label for="correo">Su correo electrónico:</label> <input type="email" id="correo" name="correo" required></p>
        <p><label for="telefono">Su teléfono:</label> <input type="tel" id="telefono" name="telefono"></p>
        <p><label for="asunto">Asunto:</label> <input type="text" id="asunto" name="asunto" required></p>
        <p><label for="mensaje">Su mensaje:</label><br><textarea id="mensaje" name="mensaje" rows="8" cols="50" maxlength="500" required></textarea></p>
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
</main>
<footer><p><a href="index.html">Volver al restaurante</a></p></footer>
</body>
</html>
